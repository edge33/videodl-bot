services:
  bot:
    image: videodl-bot:local
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      TELEGRAM_BOT_API_KEY: ${TELEGRAM_BOT_API_KEY:?Set TELEGRAM_BOT_API_KEY in .env}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?Set TELEGRAM_ALLOWED_USER_ID in .env}
      DOWNLOAD_DIR: /downloads
      STATE_DIR: /state
      QUEUE_MAX_PENDING: ${QUEUE_MAX_PENDING:-20}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-7200}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-4294967296}
      FREE_SPACE_RESERVE_BYTES: ${FREE_SPACE_RESERVE_BYTES:-2147483648}
      JOB_DEADLINE_MS: ${JOB_DEADLINE_MS:-3600000}
    volumes:
      - type: bind
        source: ${DOWNLOAD_DIR:-./downloads}
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${STATE_DIR:-./state}
        target: /state
        bind:
          create_host_path: false
